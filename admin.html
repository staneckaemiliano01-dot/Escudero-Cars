<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel | Escudero Cars</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-body"><header class="nav"><a class="brand" href="index.html"><img class="brand-logo" src="assets/escudero-cars-logo.jpg" alt="Escudero Cars"><span>ESCUDERO <b>CARS</b></span></a><a href="index.html">← Volver a la web</a></header><main class="admin-main"><div id="login" class="login-card"><p class="eyebrow">ACCESO PRIVADO</p><h1>Panel de administración</h1><p>Ingresá con el usuario autorizado para gestionar el inventario.</p><form id="loginForm"><input id="email" type="email" placeholder="Usuario / email" required><input id="password" type="password" placeholder="Contraseña" required><button class="btn" type="submit">Ingresar →</button><small id="loginMsg"></small></form></div><div id="dashboard" class="hidden"><div class="dash-head"><div><p class="eyebrow">ADMINISTRACIÓN</p><h1>Inventario</h1><p id="userLabel"></p></div><button id="logout" class="ghost">Cerrar sesión</button></div><form id="vehicleForm" class="editor"><input type="hidden" id="vehicleId"><div class="editor-title"><h2 id="formTitle">Nuevo vehículo</h2><button type="button" id="cancelEdit" class="ghost">Cancelar</button></div><div class="form-grid"><input id="vTitle" placeholder="Título (ej. Volkswagen Gol Trend)" required><input id="vBrand" placeholder="Marca" required><input id="vModel" placeholder="Modelo"><input id="vYear" type="number" placeholder="Año"><input id="vPrice" type="number" placeholder="Precio"><input id="vMileage" type="number" placeholder="Kilómetros"><input id="vFuel" placeholder="Combustible"><input id="vTransmission" placeholder="Caja"><input id="vImage" placeholder="URL de imagen (o ruta /assets/...)" class="wide"><textarea id="vDescription" placeh
